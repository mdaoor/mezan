[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan"
version = "1.0.0"
description = "Collaborative voice-model evaluation workbench"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.19",
  "alembic>=1.13",
  "httpx>=0.27",
  "jiwer>=3.0",
  "numpy>=1.26",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "typer>=0.12",
  "jsonschema>=4.20",
  "email-validator>=2.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5.0"]
silero = ["silero-vad>=5.1", "torch"]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
mizan = "mizan.cli.main:app"

[tool.setuptools.packages.find]
include = ["mizan*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
